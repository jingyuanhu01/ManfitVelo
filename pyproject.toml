[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manfitvelo"
version = "0.1.0"
description = "Velocity-aware manifold fitting and intrinsic geometry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.1", "scipy>=1.15", "scikit-learn>=1.6"]

[project.optional-dependencies]
test = ["pytest>=8.3"]
docs = ["sphinx>=7"]

[project.urls]
Repository = "https://github.com/jingyuanhu01/ManfitVelo"
Manuscript = "https://github.com/jingyuanhu01/ManfitVelo-manuscript"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
